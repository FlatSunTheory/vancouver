<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,

.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,

	}

	overflow: hidden;
	}

.leaflet-marker-icon,

	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}

}

	}

	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

	max-height: none !important;
	}

.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;

	padding: 0;
	}

	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {

}

	filter: inherit;
	visibility: hidden;
	}

	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;

	}

	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }

.leaflet-map-pane canvas { z-index: 100; }

	width: 1px;
	height: 1px;
	}
.lvml {

	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {

.leaflet-top {
	top: 0;

.leaflet-right {

.leaflet-bottom {
	bottom: 0;

.leaflet-left {

.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;

	margin-left: 10px;
	}

	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {

	}

	cursor: pointer;

.leaflet-container {

/* general typography */

/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;

	}
.leaflet-bar a,

.leaflet-bar a:focus {

/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;

	}

.leaflet-popup-tip-container {

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);

.leaflet-popup-content-wrapper,

.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";

.leaflet-oldie .leaflet-control-zoom,

/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;
	user-select: none;
	pointer-events: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;
	pointer-events: auto;
	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;

	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {

	margin-right: -12px;

.leaflet-tooltip-right:before {
	left: 0;

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#16110d; --panel:#1d1713; --panel2:#251d18; --line:#3a2e26;
  --tx:#f2e8dc; --mut:#a3948a; --amber:#f0a03c; --pump:#e2652a;
  --must:#f0a03c; --nice:#6f9ab0; --skip:#6b574a;
  --woda:#101c26; --ziemia:#1f1a15; --park:#22301f;
  --ui:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --dis:"Vollkorn",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--ui);overflow:hidden;
  display:flex;flex-direction:column;height:100vh;height:100dvh}
#map{flex:1;min-width:0;min-height:0;background:var(--woda)}
aside{width:390px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}

header{padding:13px 16px 11px;border-bottom:1px solid var(--line);background:var(--panel2)}
.eyebrow{font:500 9.5px/1 var(--mono);color:var(--mut);letter-spacing:.16em;text-transform:uppercase;margin-bottom:5px}
h1{font:600 19px/1.15 var(--dis);letter-spacing:-.005em}
h1 span{color:var(--pump)}
.sub{font:400 11.5px/1.4 var(--mono);color:var(--mut);margin-top:5px;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
#zapis{font-size:10px;color:var(--mut);margin-left:auto;letter-spacing:.02em}
#zapis.ok{color:#6f9f76} #zapis.err{color:#d08070}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:var(--panel);padding:9px 6px;text-align:center;cursor:pointer;transition:background .12s;border:0;font-family:inherit;color:inherit}
.stat:hover{background:var(--panel2)}
.stat.on{background:var(--panel2);box-shadow:inset 0 -2px 0 var(--amber)}
.stat b{display:block;font:600 19px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.stat i{display:block;font:500 9px/1 var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.13em;font-style:normal;margin-top:4px}
.stat.must b{color:var(--must)} .stat.nice b{color:var(--nice)} .stat.skip b{color:var(--skip)}

.tools{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
input[type=search]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit}
input[type=search]:focus{outline:none;border-color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:999px;padding:4px 10px;font:400 11.5px/1.35 var(--ui);cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--mut);color:var(--tx)}
.chip.on{color:#16110d;font-weight:600;border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip.on .dot{background:#16110d!important;opacity:.4}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.lbl{font:500 9px/1 var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.14em;width:100%;margin-top:4px}
select{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:5px 8px;font-size:12px;font-family:inherit;flex:1;min-width:0}
.mini{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:4px 9px;font:400 11px/1.35 var(--mono);cursor:pointer}
.mini:hover{color:var(--tx);border-color:var(--mut)}

.list{flex:1;overflow-y:auto;overscroll-behavior:contain}
.item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s;position:relative}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--amber)}
.item.p-skip{opacity:.42}
.item h3{font:600 14px/1.25 var(--dis);margin-bottom:4px;padding-right:74px;text-wrap:balance}
.meta{font-size:11px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.pri{position:absolute;top:9px;right:10px;display:flex;gap:3px}
.pb{width:22px;height:20px;border-radius:5px;border:1px solid var(--line);background:transparent;cursor:pointer;font:600 10px/1 var(--mono);color:var(--mut);padding:0;letter-spacing:.04em}
.pb:hover{border-color:var(--mut);color:var(--tx)}

a światła. Jesienią plaża jest pusta."},{"kategoria":"foto","godziny":"","sezon_do":"","wymaga_rezerwacji":false,"priorytet":"nice","gluten":"","laktoza":"","indoor":false,"swiatlo":"dzien","sciezka":[],"dystans_km":0,"przewyzszenie_m":0,"koszt_cad":0,"wymaga_auta":false,"czas_zwiedzania_h":2,"osm":"","id":"sp-091","nazwa":"Murale Mount Pleasant","lat":49.2645,"lng":-123.1002,"dzielnica":"Mount Pleasant","link":"https://vanmuralfest.ca/","foto_pora":"dzien","foto":"Kilkadziesiąt wielkoformatowych murali na ścianach kamienic i w bocznych zaułkach, zostawionych po Vancouver Mural Festival. Idzie się od ściany do ściany jak po galerii. Pochmurne światło jest lepsze — słońce robi twarde cienie na płaskich ścianach.","notatka":"Skupisko wokół Main St i E 4th–E 8th. Mapa murali na stronie festiwalu. Po drodze browary i kawiarnie."},{"kategoria":"foto","godziny":"","sezon_do":"","wymaga_rezerwacji":false,"priorytet":"nice","gluten":"","laktoza":"","indoor":false,"swiatlo":"zmrok","sciezka":[],"dystans_km":0,"przewyzszenie_m":0,"koszt_cad":0,"wymaga_auta":false,"czas_zwiedzania_h":1,"osm":"","id":"sp-092","nazwa":"Lonsdale Shipyards i żuraw nocą","lat":49.309,"lng":-123.0822,"dzielnica":"North Vancouver","link":"https://shipyardsnorthvan.ca/","foto_pora":"noc","foto":"Zabytkowy żuraw stoczniowy podświetlony na czerwono, przemysłowe hale i panorama centrum przez zatokę. Zimą stoi tu lodowisko pod gołym niebem. Odbicia w mokrym betonie po deszczu robią połowę roboty.","notatka":"Obok przystanku SeaBus i Lonsdale Quay — wszystko w zasięgu jednego wyjścia wieczorem."},{"kategoria":"foto","godziny":"","sezon_do":"","wymaga_rezerwacji":false,"priorytet":"nice","gluten":"","laktoza":"","indoor":false,"swiatlo":"dzien","sciezka":[],"dystans_km":0,"przewyzszenie_m":0,"koszt_cad":0,"wymaga_auta":false,"czas_zwiedzania_h":1,"osm":"","id":"sp-093","nazwa":"Coal Harbour — hydroplany i odbicia","lat":49.2905,"lng":-123.125,"dzielnica":"Downtown","link":"https://vancouver.ca/parks-recreation-culture/coal-harbour.aspx","foto_pora":"zloto_rano","foto":"Hydroplany startujące z wody na tle wieżowców — startują co kilkanaście minut przez cały dzień. Rano woda w zatoce bywa gładka jak lustro i całe centrum się w niej odbija. Ustawić krótki czas, żeby zamrozić pióropusz wody.","notatka":"Promenada między Canada Place a Stanley Parkiem. Po drodze rzeźba Digital Orca i znicz olimpijski."},{"kategoria":"foto","godziny":"","sezon_do":"","wymaga_rezerwacji":false,"priorytet":"nice","gluten":"","laktoza":"","indoor":false,"swiatlo":"zmrok","sciezka":[],"dystans_km":0,"przewyzszenie_m":0,"koszt_cad":0,"wymaga_auta":false,"czas_zwiedzania_h":1,"osm":"","id":"sp-094","nazwa":"Brama Millennium w Chinatown","lat":49.2797,"lng":-123.1032,"dzielnica":"Chinatown","link":"https://vancouverchinatown.ca/","foto_pora":"noc","foto":"Czerwono-złota brama nad ulicą Pender, po zmroku podświetlona, a za nią neony starego Chinatown. Stanąć na środku ulicy przy przejściu i strzelać wzdłuż osi — brama wpisuje się wtedy w perspektywę kamienic.","notatka":"Tuż obok ogrodu Sun Yat-Sen. Dzielnica wieczorem bywa trudna — Hastings jest przecznicę dalej."}]}</script>

const PLIK = "dane/stan.json";
const IDX = {}; M.forEach(m => IDX[m.id] = m);

const KAT = {
  halloween:{n:"Halloween", c:"#e2652a"}, natura:{n:"Natura", c:"#4f8f5e"},
  miasto:{n:"Miasto", c:"#7d7fbf"}, jedzenie:{n:"Jedzenie", c:"#d4a340"},
  muzeum:{n:"Muzeum", c:"#b06a9a"}, widok:{n:"Widok", c:"#4a9aa8"},

};
const OSOBY = {ja:"Wawrzyniec", ewa:"Ewa"};
const GL = {dedykowane:["gf","100% bez glutenu"], opcje:["gfo","opcje GF"], ostroznie:["gfw","GF ostrożnie"], brak:["","brak GF"]};
const LK = {dedykowane:["gf","bez nabiału"], opcje:["gfo","opcje bez nabiału"], ostroznie:["gfw","nabiał — pytać"]};
const DNI = ["niedz","pon","wt","śr","czw","pt","sob"];
const LAT = 49.2827, LNG = -123.1207;
const PORY = {
  wschod:      {n:"wschód słońca",  op:d => [d.switM, d.wschod + 45]},
  zloto_rano:  {n:"złota godzina rano", op:d => [d.wschod, d.wschod + 70]},
  dzien:       {n:"w ciągu dnia",   op:() => [11*60, 15*60]},
  zloto_wieczor:{n:"złota godzina", op:d => [d.zachod - 55, d.zachod + 5]},
  blekit:      {n:"błękitna godzina", op:d => [d.zachod + 5, d.zmierzchM]},
  noc:         {n:"po zmroku",      op:d => [d.zmierzchM, 23*60]},
  mgla:        {n:"mgła i deszcz",  op:null},
  deszcz:      {n:"w deszczu",      op:null}
};

function slonce(data){

  const n = Math.round(JD0 - 2451545.0 + 0.0008);
  const Jstar = 2451545.0 + 0.0009 + LW/360 + n;
  const Mdeg = (357.5291 + 0.98560028*(Jstar - 2451545.0)) % 360;

function strefaVan(d){
  const y = d.getFullYear();
  const mar = new Date(Date.UTC(y,2,1)); mar.setUTCDate(1 + ((7 - mar.getUTCDay()) % 7) + 7);
  const lis = new Date(Date.UTC(y,10,1)); lis.setUTCDate(1 + ((7 - lis.getUTCDay()) % 7));
  const t = Date.UTC(y, d.getMonth(), d.getDate());

function poraOpis(kod, n){
  const p = PORY[kod]; if(!p) return "";
  const dt = dataDnia(n || dzien);
  if(!p.op || !dt) return p.n;
  const s = slonce(dt), [a, b] = p.op(s);
  return p.n + " " + hhmm(a) + "–" + hhmm(b);
}
const H0 = 6, H1 = 23, PX = 40;
const TERMIN = {start:"2026-10-24", koniec:"2026-11-12"};   /* wylot z PL sob 24.10 rano, wylot z YVR 12.11, lądowanie w PL pt 13.11 */
const ZAPAS_SZLAK = 30;   /* min: szlak ma się kończyć co najmniej tyle przed zachodem */
const SW = {dzien:"za dnia", zachod:"na zachód", zmrok:"po zmroku"};

/* ---------- stan ---------- */
let stan = {wersja:4, autor:"ja", glosy:{ja:{}, ewa:{}}, plan:{}, dataStartu:"", dataKonca:"", slady:{}};
M.forEach(m => { stan.glosy.ja[m.id] = m.priorytet || ""; stan.glosy.ewa[m.id] = ""; });

function glos(id, kto){ return (stan.glosy[kto || stan.autor] || {})[id] || ""; }

function roznicaDni(a, b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/86400000); }
function przesunPlan(plan, odDaty, doDaty){
  const o = (odDaty && doDaty) ? roznicaDni(doDaty, odDaty) : 0;
  if(!o) return plan;

function scal(zrodlo, ostroznie){

  if(zrodlo.slady) Object.assign(stan.slady, zrodlo.slady);
  return {dni, pominiete};

const Zapis = {

    let lok = null;
    try{ lok = JSON.parse(localStorage.getItem(KLUCZ) || "null"); }catch(e){}

    let udane = true;
    try{ localStorage.setItem(KLUCZ, JSON.stringify(stan)); }catch(e){ udane = false; }

        this.stanTekst("zapis za chwilę","");
      } else this.stanTekst("zapis nieudany","err");

  PODKLAD.parki.forEach(r => L.polygon(r.map(p=>[p[1],p[0]]), st.park).addTo(map));
  const etyk = PODKLAD.etykiety.map(e => ({z:e.z||9, m:L.marker([e.lat,e.lng],
    {interactive:false, keyboard:false, icon:L.divIcon({className:"",
      html:`<div class="et ${e.k}">${e.t}</div>`, iconSize:[0,0], iconAnchor:[0,0]})})}));
  const etykiety = () => { const z = map.getZoom();
    etyk.forEach(o => { const jest = map.hasLayer(o.m);
      if(z >= o.z && !jest) o.m.addTo(map); else if(z < o.z && jest) map.removeLayer(o.m); }); };
  map.on("zoomend", etykiety); etykiety();
}

function geom(m){ return stan.slady[m.id] || m.sciezka; }
function zOSM(m){ return !!stan.slady[m.id]; }

function dlugoscKm(g){
  const seg = Array.isArray(g[0][0]) ? g : [g];
  let t = 0;
  seg.forEach(s => { for(let i=1;i<s.length;i++){
    const a = s[i-1], b = s[i];
    const dy = (b[0]-a[0])*111.32;
    const dx = (b[1]-a[1])*111.32*Math.cos((a[0]+b[0])/2*Math.PI/180);
    t += Math.hypot(dx,dy);
  }});
  return t;
}

const sciezki = {};
M.forEach(m => {
  if(!m.sciezka || !m.sciezka.length) return;
  const p = L.polyline(geom(m), {color:KAT[m.kategoria].c, weight:3, opacity:.8,
    dashArray:"7 5", lineCap:"round", lineJoin:"round"});
  p.on("click", () => wybierz(m.id, false));
  p.bindTooltip(`${m.nazwa} — ${m.dystans_km} km`, {sticky:true, className:"tt"});
  sciezki[m.id] = p;
});

const markery = {};
M.forEach(m => { const mk = L.marker([m.lat,m.lng], {icon:ikona(m), riseOnHover:true});
  mk.on("click", () => wybierz(m.id,false)); markery[m.id] = mk; });

function wDniu(id){ return (stan.plan[dzien]||[]).some(b => b.k === id); }

function ikona(m){
  const p = glos(m.id), c = KAT[m.kategoria].c;
  if(wDniu(m.id)){
    const r = 28;
    return L.divIcon({className:"",
      html:`<div class="mk-star ${sel===m.id?"act":""}"><svg viewBox="0 0 24 24" width="${r}" height="${r}">
        <path d="M12 1.7l3.1 6.8 7.4.8-5.6 5.1 1.6 7.3L12 18.1 5.5 21.7l1.6-7.3L1.5 9.3l7.4-.8z"
          fill="${c}" stroke="#ffd9a0" stroke-width="1.7" stroke-linejoin="round"/></svg></div>`,
      iconSize:[r,r], iconAnchor:[r/2,r/2], popupAnchor:[0,-r/2+2]});
  }
  const r = p==="must" ? 15 : 12;
  return L.divIcon({className:"",
    html:`<div class="mk ${p} ${sel===m.id?"act":""}" style="width:${r}px;height:${r}px;background:${c}"></div>`,
    iconSize:[r,r], iconAnchor:[r/2,r/2], popupAnchor:[0,-r/2]});
}

/* ---------- filtry ---------- */
const f = {kat:new Set(), q:"", indoor:false, bezAuta:false, sezon:false, gf:false, szlak:false, foto:false, dz:"", pri:""};

function pasuje(m){
  if(f.kat.size && !f.kat.has(m.kategoria)) return false;
  if(f.indoor && !m.indoor) return false;
  if(f.bezAuta && m.wymaga_auta) return false;
  if(f.sezon && !m.sezon_do) return false;
  if(f.gf && !(m.gluten==="dedykowane" || m.gluten==="opcje")) return false;
  if(f.szlak && !(m.sciezka && m.sciezka.length)) return false;
  if(f.foto && !m.foto) return false;
  if(f.dz && m.dzielnica !== f.dz) return false;
  const p = glos(m.id);
  if(f.pri === "brak"){ if(p) return false; }
  else if(f.pri === "oboje"){ if(!(glos(m.id,"ja")==="must" && glos(m.id,"ewa")==="must")) return false; }
  else if(f.pri === "sporne"){ if(!sporny(m.id)) return false; }
  else if(f.pri && p !== f.pri) return false;
  if(f.q){ const s = (m.nazwa+" "+m.dzielnica+" "+m.notatka+" "+KAT[m.kategoria].n).toLowerCase();
    if(!s.includes(f.q)) return false; }
  return true;
}

function sporny(id){
  const a = glos(id,"ja"), b = glos(id,"ewa");
  if(!a || !b) return false;
  return (a === "must" && b === "skip") || (a === "skip" && b === "must");
}

/* ---------- pomocnicze ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function domena(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return u; } }
function hhmm(min){ return String(Math.floor(min/60)).padStart(2,"0") + ":" + String(min%60).padStart(2,"0"); }
function dataDnia(n){
  if(!stan.dataStartu) return null;
  const d = new Date(stan.dataStartu + "T12:00:00");
  d.setDate(d.getDate() + (n-1));
  return d;
}
function liczbaDni(){
  const s = stan.dataStartu || TERMIN.start, k = stan.dataKonca || TERMIN.koniec;
  const n = roznicaDni(s, k) + 1;
  return (n >= 1 && n <= 45) ? n : 14;
}
function rodzajDnia(n){ return n === 1 ? "przylot" : (n === liczbaDni() ? "wylot" : ""); }
function isoDnia(n){ const d = dataDnia(n); return d ? d.toISOString().slice(0,10) : ""; }

function plakietki(m){
  const g = GL[m.gluten], l = LK[m.laktoza];
  return (m.sezon_do ? `<span class="bg warn">do ${m.sezon_do.slice(5).split("-").reverse().join(".")}</span>` : "")
   + (g ? `<span class="bg ${g[0]}">${g[1]}</span>` : "")
   + (l ? `<span class="bg ${l[0]}">${l[1]}</span>` : "")
   + (m.wymaga_auta ? '<span class="bg car">auto</span>' : "")
   + (m.indoor ? '<span class="bg in">pod dachem</span>' : "")
   + (m.foto_pora ? `<span class="bg fo">${esc(poraOpis(m.foto_pora))}</span>` : "")
   + (m.wymaga_rezerwacji ? '<span class="bg">rezerwacja</span>' : "");
}

function przyciski(id, dl){
  const p = glos(id), t = dl ? ["MUST","NICE","SKIP"] : ["M","N","S"];
  return `<button class="pb m ${p==="must"?"on":""}" data-p="must" data-id="${id}">${t[0]}</button>
  <button class="pb n ${p==="nice"?"on":""}" data-p="nice" data-id="${id}">${t[1]}</button>
  <button class="pb s ${p==="skip"?"on":""}" data-p="skip" data-id="${id}">${t[2]}</button>`;
}

function drugiGlos(id){
  const inny = stan.autor === "ja" ? "ewa" : "ja";
  const g = glos(id, inny);
  if(!g) return "";
  return `<span class="drugi ${g}" title="${OSOBY[inny]}: ${g}">${OSOBY[inny][0]}${g==="must"?"✓":g==="skip"?"✕":"·"}</span>`;
}

/* ---------- widok mapy ---------- */
function rysuj(){
  const w = M.filter(pasuje), ids = new Set(w.map(m=>m.id));
  M.forEach(m => {
    const mk = markery[m.id], sc = sciezki[m.id];
    if(ids.has(m.id)){
      mk.setIcon(ikona(m)); if(!map.hasLayer(mk)) mk.addTo(map);
      if(sc){ if(!map.hasLayer(sc)) sc.addTo(map);
        sc.setStyle(sel===m.id ? {weight:5, opacity:1, dashArray:null} : {weight:3, opacity:.8, dashArray:"7 5"}); }
    } else {
      if(map.hasLayer(mk)) map.removeLayer(mk);
      if(sc && map.hasLayer(sc)) map.removeLayer(sc);
    }
  });

  document.getElementById("list").innerHTML = w.length ? w.map(m => {
    const p = glos(m.id);
    return `<div class="item ${sel===m.id?"sel":""} ${p?"p-"+p:""} ${sporny(m.id)?"spor":""}" data-id="${m.id}" draggable="true">
      <div class="pri"><button class="pb dodaj ${wDniu(m.id)?"jest":""}" data-dodaj="${m.id}" title="wstaw w plan dnia">+</button>${przyciski(m.id)}</div>
      <h3>${esc(m.nazwa)} ${drugiGlos(m.id)}</h3>
      <div class="meta"><span style="color:${KAT[m.kategoria].c}">&#9679; ${KAT[m.kategoria].n}</span>
        <span>${esc(m.dzielnica)}</span><span>${m.czas_zwiedzania_h} h</span>
        <span>${m.koszt_cad ? m.koszt_cad+" CAD" : "gratis"}</span>
        ${m.dystans_km ? `<span class="szl">${m.dystans_km} km${m.przewyzszenie_m?" ↑"+m.przewyzszenie_m+" m":""}</span>` : ""}</div>
      <div class="badges">${plakietki(m)}</div></div>`;
  }).join("") : '<div class="empty">Żaden punkt nie pasuje do filtrów.</div>';

  statystyki(w.length);
}

function statystyki(ile){
  const c = {must:0,nice:0,skip:0,brak:0};
  M.forEach(m => c[glos(m.id)||"brak"]++);
  const must = M.filter(m => glos(m.id)==="must");
  const h = must.reduce((a,m)=>a+m.czas_zwiedzania_h,0);
  const cad = must.reduce((a,m)=>a+m.koszt_cad,0);
  const auto = must.filter(m=>m.wymaga_auta).length;
  const oboje = M.filter(m => glos(m.id,"ja")==="must" && glos(m.id,"ewa")==="must").length;
  const spor = M.filter(m => sporny(m.id)).length;

  document.getElementById("stats").innerHTML =
    [["must","must"],["nice","nice"],["skip","skip"],["brak","bez oceny"]].map(([k,l]) =>
      `<button class="stat ${k} ${f.pri===k?"on":""}" data-pri="${k}"><b>${c[k]}</b><i>${l}</i></button>`).join("");
  document.getElementById("ile").textContent = `${ile} z ${M.length} punktów`;
  document.getElementById("fnote").innerHTML =
    `${h} h · ${cad} CAD/os. · auto: ${auto}
     <button class="zg ${f.pri==="oboje"?"on":""}" data-pri="oboje">oboje must: ${oboje}</button>
     <button class="zg ${f.pri==="sporne"?"on":""}" data-pri="sporne">sporne: ${spor}</button>`;
}

function wybierz(id, przesun){
  const stary = sel; sel = id;
  [stary,id].forEach(x => { if(x && markery[x]) markery[x].setIcon(ikona(IDX[x])); });
  const m = IDX[id];
  if(przesun) map.setView([m.lat,m.lng], Math.max(map.getZoom(), TRYB==="artifact"?12:13), {animate:true});
  markery[id].bindPopup(popup(m)).openPopup();
  rysuj();
  const el = document.querySelector('.item[data-id="'+id+'"]');
  if(el) el.scrollIntoView({block:"nearest"});
}

function popup(m){
  return `<div class="pop"><h4>${esc(m.nazwa)}</h4>
    <div class="pm"><span style="color:${KAT[m.kategoria].c}">&#9679; ${KAT[m.kategoria].n}</span> &middot; ${esc(m.dzielnica)} &middot; ${m.czas_zwiedzania_h} h &middot; ${m.koszt_cad?m.koszt_cad+" CAD":"gratis"}</div>
    ${m.dystans_km ? `<div class="pm szlak-info ${zOSM(m)?"real":""}">Szlak: ${m.dystans_km} km${m.przewyzszenie_m?" · ↑ "+m.przewyzszenie_m+" m":""}<br>${zOSM(m)
      ? "Przebieg z OpenStreetMap (" + dlugoscKm(geom(m)).toFixed(1) + " km narysowanego śladu)."
      : (TRYB === "lokalny"
          ? "Linia jest orientacyjna — kliknij „Ślady OSM” u dołu listy, żeby wczytać prawdziwy przebieg."
          : "Linia jest orientacyjna. Prawdziwy przebieg wczytuje wersja plikowa (przycisk „Ślady OSM”), potem Eksport i Import tutaj.")}</div>` : ""}
    ${m.godziny ? `<div class="pm">Godziny: ${esc(m.godziny)}</div>` : ""}
    ${m.sezon_do ? `<div class="pm" style="color:#ffb4a0">Czynne do ${m.sezon_do}</div>` : ""}
    ${m.swiatlo ? `<div class="pm" style="color:#e8c48a">Światło: ${SW[m.swiatlo]}${(() => { const o = oknoStartu(m, dzien); return o ? " · " + o.t : ""; })()}</div>` : ""}
    <div class="nt">${esc(m.notatka)}</div>
    ${m.foto ? `<div class="fotobox"><b>Zdjęcia — ${esc(poraOpis(m.foto_pora))}</b>${esc(m.foto)}</div>` : ""}
    <div class="badges">${plakietki(m)}</div>
    ${m.link ? `<a class="lnk" href="${esc(m.link)}" target="_blank" rel="noopener noreferrer">${esc(domena(m.link))} &#8599;</a>` : ""}
    <div class="pri">${przyciski(m.id,1)}</div>
    <button class="wplan ${wDniu(m.id)?"jest":""}" data-dodaj="${m.id}">${wDniu(m.id)?"jest w planie tego dnia":"wstaw w plan dnia"}</button></div>`;
}

function ustawGlos(id, p){
  stan.glosy[stan.autor][id] = (glos(id) === p) ? "" : p;
  Zapis.zmiana();
  if(markery[id]){ markery[id].setIcon(ikona(IDX[id]));
    const pp = markery[id].getPopup();
    if(pp && pp.isOpen()) pp.setContent(popup(IDX[id])); }
  rysuj();
}


/* ---------- plan dnia: panel na mapie ---------- */
function poz(n){ stan.plan[n] = stan.plan[n] || []; return stan.plan[n]; }
function nazwaBloku(b){ return b.k ? IDX[b.k].nazwa : (b.nazwa || "notatka"); }
function katBloku(b){ return b.k ? KAT[IDX[b.k].kategoria].c : "#8a7a6e"; }
function poSezonie(b, n){
  if(!b.k) return false;
  const s = IDX[b.k].sezon_do, d = isoDnia(n);
  return !!(s && d && d > s);
}

function swiatloMiejsca(b){ return b.k ? (IDX[b.k].swiatlo || "") : ""; }
function ocenaSwiatla(b, n){
  const dd = dataDnia(n), w = swiatloMiejsca(b);
  if(!dd || !w) return null;
  const s = slonce(dd), a = b.start, z = b.start + b.dl, szlak = b.k && IDX[b.k].kategoria === "trasa";
  if(w === "dzien"){
    if(z > s.zachod) return {p:2, t:"po zachodzie ("+hhmm(s.zachod)+")"};
    if(szlak && z > s.zachod - ZAPAS_SZLAK) return {p:1, t:"na styk — zachód "+hhmm(s.zachod)};
    if(a < s.swit) return {p:2, t:"przed świtem ("+hhmm(s.swit)+")"};
    if(a < s.wschod) return {p:1, t:"przed wschodem ("+hhmm(s.wschod)+")"};
  } else if(w === "zachod"){
    if(z < s.zachod - 55) return {p:1, t:"za wcześnie — złota od "+hhmm(s.zachod-55)};
    if(a > s.zmierzch) return {p:1, t:"już ciemno ("+hhmm(s.zmierzch)+")"};
  } else if(w === "zmrok"){
    if(z <= s.zachod) return {p:1, t:"jeszcze jasno — zachód "+hhmm(s.zachod)};
  }
  return null;
}
function oknoStartu(m, n){
  const dd = dataDnia(n); if(!dd || !m) return null;
  const s = slonce(dd), dl = Math.round(m.czas_zwiedzania_h*60);
  if(m.swiatlo === "dzien"){
    const od = Math.max(H0*60, s.wschod), koniec = s.zachod - (m.kategoria === "trasa" ? ZAPAS_SZLAK : 0) - dl;
    return {od, do:koniec, t: koniec < od ? "nie mieści się w dniu" : "start "+hhmm(od)+"–"+hhmm(koniec)};
  }
  if(m.swiatlo === "zachod"){ const od = s.zachod - 55 - Math.max(0, dl - 90); return {od, do:s.zachod, t:"start "+hhmm(od)+"–"+hhmm(s.zachod)}; }
  if(m.swiatlo === "zmrok"){ const od = s.zachod; return {od, do:(H1+1)*60 - dl, t:"po "+hhmm(od)}; }
  return null;
}

function pasy(bloki){
  const s = bloki.slice().sort((a,b) => a.start - b.start || a.dl - b.dl);
  const konce = [];
  s.forEach(b => {
    let i = 0;
    while(konce[i] !== undefined && konce[i] > b.start) i++;
    b._pas = i; konce[i] = b.start + b.dl;
  });
  const n = Math.max(1, konce.length);
  s.forEach(b => b._pasow = n);
  return s;
}

function rysujPlan(){
  const b = poz(dzien), d = dataDnia(dzien);
  const sel2 = document.getElementById("wybor-dnia");
  sel2.innerHTML = Array.from({length:liczbaDni()}, (_,i) => {
    const n = i+1, dd = dataDnia(n), il = poz(n).length;
    const sz = dd ? " ☼"+hhmm(slonce(dd).zachod) : "", rd = rodzajDnia(n);
    return `<option value="${n}" ${n===dzien?"selected":""}>${n}. ${dd ? dd.getDate()+"."+(dd.getMonth()+1)+" "+DNI[dd.getDay()] : "dzień"}${rd?" · "+rd:""}${sz}${il?"  ("+il+")":""}</option>`;
  }).join("");

  const auto = b.filter(x => x.k && IDX[x.k].wymaga_auta).length;
  const koszt = b.reduce((a,x) => a + (x.k ? IDX[x.k].koszt_cad : 0), 0);
  const godz = b.reduce((a,x) => a + x.dl, 0)/60;
  document.getElementById("ph-sub").innerHTML =
    `<span>${godz ? (godz%1?godz.toFixed(1):godz)+" h" : "pusto"}${koszt?" · "+koszt+" CAD":""}${auto?" · auto":""}</span>
     ${d && d.getDay()===1 ? '<span class="bg warn">pon — muzea</span>' : ""}
     ${rodzajDnia(dzien) ? `<span class="bg gfo">${rodzajDnia(dzien)}</span>` : ""}
     ${(() => { const ile = b.filter(x => { const o = ocenaSwiatla(x, dzien); return o && o.p === 2; }).length;
        return ile ? `<span class="bg warn">${ile}× po ciemku</span>` : ""; })()}
     ${trzymany ? (() => { const o = trzymany.k ? oknoStartu(IDX[trzymany.k], dzien) : null;
        return `<span class="bg gfo">kliknij godzinę${o ? " · " + o.t : ""}</span>`; })() : ""}
     ${d ? (() => { const sl = slonce(d);
        const dl = sl.zachod - sl.wschod;
        return `<span class="sl">&#9788; ${hhmm(sl.wschod)}&ndash;${hhmm(sl.zachod)} (${Math.floor(dl/60)} h ${String(dl%60).padStart(2,"0")}) &middot; z&#322;ota od ${hhmm(sl.zachod-55)} &middot; ciemno od ${hhmm(sl.zmierzch)}</span>`;
     })() : ""}`;

  const siatka = document.getElementById("siatka");
  let html = '<div class="godziny">';
  for(let h=H0; h<=H1; h++) html += `<div class="gr" style="height:${PX}px"><span>${String(h).padStart(2,"0")}</span></div>`;
  html += '</div><div class="slupek" id="slupek">';
  for(let h=H0; h<=H1; h++) html += `<div class="slot" data-min="${h*60}" style="height:${PX}px"></div>`;
  if(d){
    const sl = slonce(d), y = m => (Math.max(H0*60, Math.min((H1+1)*60, m)) - H0*60)/60*PX;
    const pas = (a, z, k) => z > a ? `<div class="swl ${k}" style="top:${y(a)}px;height:${y(z)-y(a)}px"></div>` : "";
    html += pas(H0*60, sl.swit, "noc") + pas(sl.swit, sl.wschod, "szaro") +
            pas(sl.zachod, sl.zmierzch, "szaro") + pas(sl.zmierzch, (H1+1)*60, "noc");
    html += `<div class="swlinia" style="top:${y(sl.zachod)}px"><span>zachód ${hhmm(sl.zachod)}</span></div>`;
    const ok = trzymany && trzymany.k ? oknoStartu(IDX[trzymany.k], dzien) : null;
    if(ok && ok.do >= ok.od) html += `<div class="swokno" style="top:${y(ok.od)}px;height:${Math.max(4, y(ok.do)-y(ok.od))}px"></div>`;
  }

  pasy(b).forEach(x => {
    const top = (x.start - H0*60)/60*PX;
    const wys = Math.max(22, x.dl/60*PX - 3);
    const szer = 100/x._pasow, lewo = x._pas*szer;
    const zly = poSezonie(x, dzien), sw = ocenaSwiatla(x, dzien);
    html += `<div class="blok ${x.k?"":"nota"} ${zly||(sw&&sw.p===2)?"zly":""}" data-i="${b.indexOf(x)}"
      style="top:${top}px;height:${wys}px;left:calc(${lewo}% + 2px);width:calc(${szer}% - 6px);border-left-color:${katBloku(x)}">
      <div class="uchwyt gora" data-uchwyt="gora"></div>
      <div class="bt">${hhmm(x.start)}–${hhmm(x.start+x.dl)}</div>
      <div class="bn">${esc(nazwaBloku(x))}</div>
      ${zly ? '<div class="bw">po sezonie</div>' : ""}
      ${sw ? `<div class="bw ${sw.p===1?"lek":""}">${sw.p===1?"◐":"●"} ${esc(sw.t)}</div>` : ""}
      ${x.nota ? `<div class="bnota">${esc(x.nota)}</div>` : ""}
      <div class="bakcje">
        <button class="bx" data-akcja="nota" title="notatka">✎</button>
        <button class="bx del" data-akcja="usun" title="usuń">×</button>
      </div>
      <div class="uchwyt dol" data-uchwyt="dol"></div>
    </div>`;
  });

  if(wpis){
    const top = (wpis.min - H0*60)/60*PX;
    html += `<div class="nowa" style="top:${top}px">
      <span class="nt-godz">${hhmm(wpis.min)}</span>
      <input id="nowa-tekst" placeholder="${wpis.i === null ? "Twoja notatka…" : "Zmień treść…"}"
        value="${esc(wpis.tekst || "")}" autocomplete="off">
    </div>`;
  }
  html += "</div>";
  siatka.innerHTML = html;

  if(wpis){
    const inp = document.getElementById("nowa-tekst");
    inp.focus(); inp.select();
    inp.addEventListener("keydown", e => {
      if(e.key === "Enter") zapiszWpis(inp.value);
      else if(e.key === "Escape"){ wpis = null; rysujPlan(); }
    });
    inp.addEventListener("blur", () => setTimeout(() => { if(wpis) zapiszWpis(inp.value); }, 130));
  }
}

function zapiszWpis(t){
  const w = wpis; wpis = null;
  const tekst = (t || "").trim();
  if(w.i === null){
    if(tekst) poz(dzien).push({k:null, nazwa:tekst, start:w.min, dl:60, nota:""});
  } else {
    const x = poz(dzien)[w.i];
    if(x){ if(x.k) x.nota = tekst; else if(tekst) x.nazwa = tekst; }
  }
  Zapis.zmiana(); rysujPlan(); odswiezMarkery();
}

function wstaw(min){
  if(!trzymany) return;
  const m = trzymany.k ? IDX[trzymany.k] : null;
  poz(dzien).push({k:trzymany.k||null, nazwa:trzymany.nazwa||"", start:min,
    dl:Math.round((m ? m.czas_zwiedzania_h : 1)*60), nota:""});
  trzymany = null;
  Zapis.zmiana(); rysujPlan(); odswiezMarkery();
}

function odswiezMarkery(){ M.forEach(m => markery[m.id].setIcon(ikona(m))); rysuj(); }

function akcjaBloku(i, akcja){
  const b = poz(dzien), x = b[i]; if(!x) return;
  if(akcja === "usun"){ b.splice(i,1); Zapis.zmiana(); rysujPlan(); odswiezMarkery(); return; }
  if(akcja === "nota"){ wpis = {min:x.start, i:i, tekst: x.k ? (x.nota||"") : (x.nazwa||"")}; rysujPlan(); }
}

/* ---------- przeciąganie i rozciąganie bloków ---------- */
const KROK = 15;
function snap(min){ return Math.round(min/KROK)*KROK; }

document.addEventListener("pointerdown", e => {
  const blok = e.target.closest(".blok");
  if(!blok || e.target.closest(".bx")) return;
  const i = +blok.dataset.i, x = poz(dzien)[i]; if(!x) return;
  const u = e.target.closest(".uchwyt");
  ciag = {tryb: u ? u.dataset.uchwyt : "ruch", el:blok, x, y0:e.clientY, start0:x.start, dl0:x.dl, ruszony:false};
  blok.setPointerCapture(e.pointerId);
  blok.classList.add("ciagniety");
  e.preventDefault();
});

document.addEventListener("pointermove", e => {
  if(!ciag) return;
  const dmin = (e.clientY - ciag.y0)/PX*60;
  if(Math.abs(e.clientY - ciag.y0) > 3) ciag.ruszony = true;
  const x = ciag.x;
  if(ciag.tryb === "dol"){
    x.dl = Math.max(30, Math.min((H1+1)*60 - x.start, snap(ciag.dl0 + dmin)));
  } else if(ciag.tryb === "gora"){
    const ns = Math.max(H0*60, Math.min(ciag.start0 + ciag.dl0 - 30, snap(ciag.start0 + dmin)));
    x.dl = ciag.dl0 + (ciag.start0 - ns); x.start = ns;
  } else {
    x.start = Math.max(H0*60, Math.min((H1+1)*60 - x.dl, snap(ciag.start0 + dmin)));
  }
  ciag.el.style.top = ((x.start - H0*60)/60*PX) + "px";
  ciag.el.style.height = Math.max(22, x.dl/60*PX - 3) + "px";
  const bt = ciag.el.querySelector(".bt");
  if(bt) bt.textContent = hhmm(x.start) + "–" + hhmm(x.start + x.dl);
});

document.addEventListener("pointerup", () => {
  if(!ciag) return;
  const byl = ciag.ruszony, el = ciag.el, x = ciag.x, i = +el.dataset.i;
  ciag = null;
  el.classList.remove("ciagniety");
  if(byl){ Zapis.zmiana(); rysujPlan(); }
  else if(x.k){ wybierz(x.k, true); }
  else akcjaBloku(i, "nota");
});

/* ---------- zdarzenia ---------- */
document.addEventListener("click", e => {
  const dodaj = e.target.closest("[data-dodaj]");
  if(dodaj){
    e.stopPropagation();
    const id = dodaj.dataset.dodaj;
    trzymany = (trzymany && trzymany.k === id) ? null : {k:id};
    pokazPanel(true); rysujPlan(); rysuj();
    return;
  }
  const pb = e.target.closest(".pb:not(.dodaj)");
  if(pb){ e.stopPropagation(); ustawGlos(pb.dataset.id, pb.dataset.p); return; }

  const kto = e.target.closest(".kto b");
  if(kto){ stan.autor = kto.dataset.kto; Zapis.zmiana(); odswiezOsobe(); return; }

  const st = e.target.closest(".stat, .zg");
  if(st){ f.pri = (f.pri === st.dataset.pri) ? "" : st.dataset.pri; rysuj(); return; }

  const nav = e.target.closest(".nav");
  if(nav){ dzien = Math.min(liczbaDni(), Math.max(1, dzien + (+nav.dataset.d))); wpis = null; rysujPlan(); odswiezMarkery(); return; }

  const bx = e.target.closest(".bx");
  if(bx){ e.stopPropagation(); akcjaBloku(+bx.closest(".blok").dataset.i, bx.dataset.akcja); return; }

  const slot = e.target.closest(".slot");
  if(slot){
    const min = +slot.dataset.min;
    if(trzymany) wstaw(min);
    else { wpis = {min:min, i:null, tekst:""}; rysujPlan(); }
    return;
  }

  if(e.target.closest(".nowa")) return;

  const it = e.target.closest(".item");
  if(it){ wybierz(it.dataset.id, true); }
});

document.addEventListener("dragstart", e => {
  const it = e.target.closest(".item");
  if(it){ trzymany = {k:it.dataset.id}; e.dataTransfer.effectAllowed = "copy"; pokazPanel(true); rysujPlan(); }
});
document.addEventListener("dragover", e => { if(e.target.closest(".slot") && trzymany) e.preventDefault(); });
document.addEventListener("drop", e => {
  const s = e.target.closest(".slot");
  if(s && trzymany){ e.preventDefault(); wstaw(+s.dataset.min); }
});

function odswiezOsobe(){
  document.querySelectorAll(".kto b").forEach(b => b.classList.toggle("on", b.dataset.kto === stan.autor));
  odswiezMarkery();
}

function pokazPanel(w){
  const p = document.getElementById("planel");
  p.classList.toggle("zwiniety", w === false ? true : (w === true ? false : !p.classList.contains("zwiniety")));
  document.getElementById("zwin").textContent = p.classList.contains("zwiniety") ? "+" : "–";

document.getElementById("zwin").addEventListener("click", () => pokazPanel());
document.getElementById("wybor-dnia").addEventListener("change", e => {
  dzien = +e.target.value; wpis = null; rysujPlan(); odswiezMarkery();
});
const inpData = document.getElementById("start");
inpData.addEventListener("change", () => {
  if(!inpData.value) return;
  stan.plan = przesunPlan(stan.plan, stan.dataStartu, inpData.value);   /* wpisy zostają przy swoich datach */
  stan.dataStartu = inpData.value; dzien = Math.min(dzien, liczbaDni()); Zapis.zmiana(); rysujPlan(); odswiezMarkery();
});
const inpKoniec = document.getElementById("koniec");
inpKoniec.addEventListener("change", () => {
  if(!inpKoniec.value) return;
  stan.dataKonca = inpKoniec.value; dzien = Math.min(dzien, liczbaDni()); Zapis.zmiana(); rysujPlan(); odswiezMarkery();
});
function pokazDaty(){ inpData.value = stan.dataStartu || TERMIN.start; inpKoniec.value = stan.dataKonca || TERMIN.koniec; }
let czyscTimer = null;
const btnCzysc = document.getElementById("czysc-dzien");
function resetCzysc(){
  clearTimeout(czyscTimer); czyscTimer = null;
  btnCzysc.classList.remove("pewnie"); btnCzysc.textContent = "Wyczyść dzień";
}
btnCzysc.addEventListener("click", () => {
  if(!poz(dzien).length){ btnCzysc.textContent = "dzień pusty"; setTimeout(resetCzysc, 1400); return; }
  if(!czyscTimer){
    btnCzysc.classList.add("pewnie"); btnCzysc.textContent = "Na pewno?";
    czyscTimer = setTimeout(resetCzysc, 4000);
    return;
  }
  stan.plan[dzien] = []; trzymany = null; wpis = null;
  resetCzysc(); Zapis.zmiana(); rysujPlan(); odswiezMarkery();
});

/* ---------- filtry ---------- */
document.getElementById("cats").innerHTML = Object.entries(KAT).map(([k,v]) =>
  `<button class="chip" data-k="${k}"><i class="dot" style="background:${v.c}"></i>${v.n}</button>`).join("");
document.getElementById("cats").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if(!c) return;
  const k = c.dataset.k;
  if(f.kat.has(k)){ f.kat.delete(k); c.classList.remove("on"); c.style.background=""; }
  else { f.kat.add(k); c.classList.add("on"); c.style.background = KAT[k].c; }
  rysuj();
});
document.getElementById("flags").innerHTML =
  [["indoor","Pod dachem"],["bezAuta","Bez auta"],["sezon","Sezonowe"],["gf","Bezpieczne GF"],["szlak","Ze szlakiem"],["foto","Do zdjęć"]]
  .map(([k,n]) => `<button class="chip" data-f="${k}">${n}</button>`).join("");
document.getElementById("flags").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if(!c) return;
  const k = c.dataset.f; f[k] = !f[k];

const sd = document.getElementById("dz");
[...new Set(M.map(m => m.dzielnica))].sort().forEach(d => {
  const o = document.createElement("option"); o.value = o.textContent = d; sd.appendChild(o); });
sd.addEventListener("change", () => { f.dz = sd.value; rysuj(); });

  f.kat.clear(); f.q=""; f.indoor=f.bezAuta=f.sezon=f.gf=f.szlak=f.foto=false; f.dz=""; f.pri="";
  document.getElementById("q").value=""; sd.value="";
  document.querySelectorAll(".chip").forEach(c => { c.classList.remove("on"); c.style.background=""; });
  rysuj();
});

/* ---------- pobieranie prawdziwych śladów z OpenStreetMap ---------- */
const OVERPASS = ["https://overpass-api.de/api/interpreter",
                  "https://overpass.kumi.systems/api/interpreter"];

function upros(p, eps){
  if(p.length < 3) return p;
  const keep = new Array(p.length).fill(false);
  keep[0] = keep[p.length-1] = true;
  const stos = [[0, p.length-1]];
  while(stos.length){
    const [i,j] = stos.pop();
    if(j <= i+1) continue;
    const ax=p[i][0], ay=p[i][1], bx=p[j][0], by=p[j][1];
    const dx=bx-ax, dy=by-ay, n=Math.hypot(dx,dy);
    let best=-1, bi=-1;
    for(let k=i+1;k<j;k++){
      const d = n ? Math.abs(dx*(ay-p[k][1]) - (ax-p[k][0])*dy)/n
                  : Math.hypot(p[k][0]-ax, p[k][1]-ay);
      if(d>best){ best=d; bi=k; }
    }
    if(best>eps){ keep[bi]=true; stos.push([i,bi],[bi,j]); }
  }
  return p.filter((_,k)=>keep[k]);
}

async function overpass(zapytanie){
  let ostatni = null;
  for(const url of OVERPASS){
    try{
      const r = await fetch(url, {method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"data=" + encodeURIComponent(zapytanie)});
      if(!r.ok){ ostatni = new Error("HTTP " + r.status); continue; }
      return await r.json();
    }catch(e){ ostatni = e; }
  }
  throw ostatni || new Error("brak połączenia");
}

async function pobierzSlady(){
  const btn = document.getElementById("osm");
  const cele = M.filter(m => m.osm);
  if(btn.dataset.biegnie) return;
  btn.dataset.biegnie = "1";
  let ok = 0, pusto = 0, blad = 0;
  for(let i = 0; i < cele.length; i++){
    const m = cele[i];
    btn.textContent = (i+1) + "/" + cele.length + "…";
    try{
      const d = await overpass("[out:json][timeout:60];(" + m.osm + ";);out geom;");
      const segs = (d.elements || [])
        .filter(e => e.geometry && e.geometry.length > 1)
        .map(e => upros(e.geometry.map(g => [g.lat, g.lon]), 0.00006))
        .filter(x => x.length > 1);
      if(segs.length){ stan.slady[m.id] = segs; ok++; } else pusto++;
    }catch(e){ blad++; }
    if(i < cele.length - 1) await new Promise(r => setTimeout(r, 1400));
  }
  delete btn.dataset.biegnie;
  Object.keys(stan.slady).forEach(id => { if(sciezki[id]) sciezki[id].setLatLngs(stan.slady[id]); });
  Zapis.zmiana(); rysuj();
  btn.textContent = blad === cele.length ? "brak dostępu" : (ok + " z " + cele.length);
  setTimeout(() => btn.textContent = "Ślady OSM", 5000);
}
const btnOsm = document.getElementById("osm");
if(TRYB === "lokalny") btnOsm.addEventListener("click", pobierzSlady);
else btnOsm.style.display = "none";

/* ---------- eksport / import ---------- */
function doEksportu(){
  return JSON.stringify({wersja:2, autor:stan.autor, aktualizacja:new Date().toISOString().slice(0,10),
    dataStartu:stan.dataStartu, dataKonca:stan.dataKonca, glosy:stan.glosy, plan:stan.plan, slady:stan.slady,
    miejsca:M.map(m => ({id:m.id, nazwa:m.nazwa, glos_ja:glos(m.id,"ja"), glos_ewa:glos(m.id,"ewa")}))}, null, 2);
}
function mrugnij(id, t){
  const e = document.getElementById(id), stare = e.textContent;
  e.textContent = t; setTimeout(() => e.textContent = stare, 1800);
}
document.getElementById("exp").addEventListener("click", async () => {
  const tekst = doEksportu(), plik = "vancouver-oceny-" + stan.autor + ".json";
  if(TRYB === "artifact"){
    let d = null; try{ d = await window.claude.use("downloads"); }catch(e){}
    if(d){ try{ await d.save({filename:plik, data:tekst}); return; }catch(e){} }
    try{ await navigator.clipboard.writeText(tekst); mrugnij("exp","skopiowane"); }
    catch(e){ mrugnij("exp","nie udało się"); }
    return;
  }
  const bl = new Blob([tekst], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(bl); a.download = plik; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
document.getElementById("imp").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", e => {
  const fl = e.target.files[0]; if(!fl) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result), przed = JSON.stringify(stan.glosy);
      const w = d.glosy ? scal({glosy:d.glosy, plan:d.plan, dataStartu:d.dataStartu, dataKonca:d.dataKonca, slady:d.slady}, true) : {dni:0, pominiete:0};
      if(!d.glosy && d.miejsca) d.miejsca.forEach(m => {
        if(!(m.id in IDX)) return;
        if(m.glos_ja) stan.glosy.ja[m.id] = m.glos_ja;
        if(m.glos_ewa) stan.glosy.ewa[m.id] = m.glos_ewa;
        if(m.priorytet) stan.glosy.ja[m.id] = m.priorytet;
      });
      Zapis.zmiana();
      pokazDaty();
      Object.keys(stan.slady).forEach(id => { if(sciezki[id]) sciezki[id].setLatLngs(stan.slady[id]); });
      odswiezOsobe(); rysujPlan();
      const opis = [];
      if(JSON.stringify(stan.glosy) !== przed) opis.push("oceny");
      if(w.dni) opis.push(w.dni + " dni planu");
      if(w.pominiete) opis.push(w.pominiete + " dni pominięto");
      mrugnij("imp", opis.length ? opis.join(", ") : "bez zmian");
    }catch(err){ alert("Nie udało się wczytać pliku: " + err.message); }
    e.target.value = "";
  };
  r.readAsText(fl);
});

/* ---------- start ---------- */
rysuj(); rysujPlan();
Zapis.start().then(() => {
  if(!stan.dataStartu) stan.dataStartu = TERMIN.start;
  if(!stan.dataKonca) stan.dataKonca = TERMIN.koniec;
  pokazDaty();
  Object.keys(stan.slady).forEach(id => { if(sciezki[id]) sciezki[id].setLatLngs(stan.slady[id]); });
  odswiezOsobe(); rysujPlan();
});
setTimeout(() => map.invalidateSize(), 120);
})();
